<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業財經工具箱 - 釘選排序版</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --primary-blue: #1a5f7a; --accent-blue: #eef5f9; --text-main: #2c3e50; --border-color: #dbe4eb; }
        body { background-color: #f0f4f7; color: var(--text-main); font-size: 14px; padding-bottom: 40px; font-family: "Microsoft JhengHei", sans-serif; }
        .container { max-width: 650px; }
        .nav-tabs { border-bottom: 3px solid var(--primary-blue); background: white; }
        .nav-tabs .nav-link { border: none; color: #7f8c8d; font-weight: bold; padding: 12px; }
        .nav-tabs .nav-link.active { background: var(--primary-blue) !important; color: white !important; border-radius: 8px 8px 0 0; }
        .tab-content { background: white; padding: 20px; border-radius: 0 0 12px 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .section-header { background: var(--accent-blue); color: var(--primary-blue); font-weight: bold; padding: 10px 15px; border-radius: 8px; margin-bottom: 15px; border-left: 5px solid var(--primary-blue); display: flex; justify-content: space-between; align-items: center; }
        .list-container { max-height: 200px; overflow-y: auto; border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; background: #fff; margin-bottom: 15px; }
        .table-custom { width: 100%; border-collapse: collapse; background: white; table-layout: fixed; }
        .table-custom thead th { background: var(--primary-blue); color: white; padding: 10px 8px; font-weight: 500; }
        .table-custom tbody td { padding: 10px 8px; border-bottom: 1px solid #eee; vertical-align: middle; word-wrap: break-word; }
        .code-highlight { font-weight: bold; color: #d63031; font-family: 'Consolas', monospace; font-size: 1.1rem; }
        .btn-shot { background: var(--primary-blue); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; width: 100%; }
        .btn-pin-cfg { font-size: 0.8rem; padding: 2px 8px; border-radius: 5px; background: white; color: var(--primary-blue); border: 1px solid var(--primary-blue); cursor: pointer; }
        /* 釘選清單樣式 */
        #pinSettingsArea { display: none; background: #fff; border: 2px solid var(--primary-blue); border-radius: 10px; padding: 15px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container py-3">
    <h5 class="text-center fw-bold mb-3" style="color: var(--primary-blue);">理財顧問專業查詢工具</h5>

    <div id="pinSettingsArea">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h6 class="fw-bold mb-0">📌 常用機構釘選設定</h6>
            <button class="btn btn-sm btn-primary" onclick="savePins()">完成設定</button>
        </div>
        <p class="small text-muted">勾選後，該機構將會出現在選單最上方</p>
        <div id="pinCheckboxes" class="list-container" style="max-height: 300px;">
            </div>
    </div>

    <ul class="nav nav-tabs nav-fill" id="myTab" role="tablist">
        <li class="nav-item"><button class="nav-link active" id="on-tab" data-bs-toggle="tab" data-bs-target="#on-pane">境內基金</button></li>
        <li class="nav-item"><button class="nav-link" id="off-tab" data-bs-toggle="tab" data-bs-target="#off-panel">歐義銳榮</button></li>
        <li class="nav-item"><button class="nav-link" id="tax-tab" data-bs-toggle="tab" data-bs-target="#tax-pane">稅務分析</button></li>
    </ul>

    <div class="tab-content" id="myTabContent">
        <div class="tab-pane fade show active" id="on-pane">
            <div class="section-header">
                <span>境內基金代號查詢</span>
                <button class="btn-pin-cfg" onclick="togglePinSettings()">⚙️ 釘選設定</button>
            </div>
            <select id="bankOn" class="form-select mb-3"><option value="">-- 選擇銷售機構 --</option></select>
            <div class="d-flex justify-content-between mb-3 px-1">
                <div class="form-check"><input class="form-check-input on-filter" type="checkbox" id="onPost"><label class="form-check-label">後收</label></div>
                <div class="form-check"><input class="form-check-input on-filter" type="checkbox" id="onDiv"><label class="form-check-label">配息</label></div>
                <div class="form-check"><input class="form-check-input on-filter" type="checkbox" id="onRMB"><label class="form-check-label">人民幣</label></div>
            </div>
            <div id="listOn" class="list-container">請先選擇機構...</div>
            <div id="areaOn" style="display:none;">
                <div id="captureOn" style="background: white; padding: 10px;">
                    <h6 class="text-center fw-bold mb-2 p-2 rounded" id="titleOn" style="color: var(--primary-blue); background: var(--accent-blue);"></h6>
                    <table class="table-custom">
                        <thead><tr><th style="width:75%">基金明細</th><th class="text-center" style="width:25%">代號</th></tr></thead>
                        <tbody id="bodyOn"></tbody>
                    </table>
                </div>
                <button class="btn btn-shot mt-3" onclick="takeScreenshot('captureOn', '境內基金', 12)">📸 拍照截圖 (12筆/頁)</button>
            </div>
        </div>

        <div class="tab-pane fade" id="off-pane">
            <div class="section-header">
                <span>歐義銳榮代號查詢</span>
                <button class="btn-pin-cfg" onclick="togglePinSettings()">⚙️ 釘選設定</button>
            </div>
            <select id="bankOff" class="form-select mb-3"><option value="">-- 選擇銷售機構 --</option></select>
            <div class="row g-1 mb-3 px-1">
                <div class="col-4"><div class="form-check"><input class="form-check-input off-filter" type="checkbox" id="offUSD"><label class="form-check-label">美元</label></div></div>
                <div class="col-4"><div class="form-check"><input class="form-check-input off-filter" type="checkbox" id="offUSDH"><label class="form-check-label">美避</label></div></div>
                <div class="col-4"><div class="form-check"><input class="form-check-input off-filter" type="checkbox" id="offDIV"><label class="form-check-label text-danger fw-bold">配息(月)</label></div></div>
                <div class="col-4"><div class="form-check"><input class="form-check-input off-filter" type="checkbox" id="offEUR"><label class="form-check-label">歐元</label></div></div>
                <div class="col-4"><div class="form-check"><input class="form-check-input off-filter" type="checkbox" id="offEURH"><label class="form-check-label">歐避</label></div></div>
                <div class="col-4"><div class="form-check"><input class="form-check-input off-filter" type="checkbox" id="offAUD"><label class="form-check-label">澳幣</label></div></div>
            </div>
            <div id="listOff" class="list-container">請先選擇機構...</div>
            <div id="areaOff" style="display:none;">
                <div id="captureOff" style="background: white; padding: 10px;">
                    <h6 class="text-center fw-bold mb-2 p-2 rounded" id="titleOff" style="color: var(--primary-blue); background: var(--accent-blue);"></h6>
                    <table class="table-custom">
                        <thead><tr><th style="width:75%">主要基金名稱</th><th class="text-center" style="width:25%">代號</th></tr></thead>
                        <tbody id="bodyOff"></tbody>
                    </table>
                </div>
                <button class="btn btn-shot mt-3" onclick="takeScreenshot('captureOff', '歐義銳榮', 10)">📸 拍照截圖 (10筆/頁)</button>
            </div>
        </div>

        <div class="tab-pane fade" id="tax-pane">
            <div class="section-header">投資工具稅務面面觀</div>
            <div id="listTax" class="list-container">載入中...</div>
            <div id="areaTax" style="display:none;">
                <div id="captureTax" style="background: white; padding: 10px;">
                    <h6 class="text-center fw-bold py-2 mb-3" style="color: white; background: var(--primary-blue); border-radius: 5px;">稅務處理概覽表</h6>
                    <table class="table-custom">
                        <thead>
                            <tr><th style="width:25%">工具類型</th><th style="width:20%">自然人</th><th style="width:25%">法人</th><th style="width:30%">備註</th></tr>
                        </thead>
                        <tbody id="bodyTax"></tbody>
                    </table>
                </div>
                <button class="btn btn-shot mt-3" onclick="takeScreenshot('captureTax', '稅務分析', 8)">📸 拍照截圖 (8筆/頁)</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let dataOn = [], dataOff = [], dataTax = [];
    let allBanks = []; // 儲存所有銀行清單

    // 從本地端取得釘選名單
    function getPinnedBanks() {
        return JSON.parse(localStorage.getItem('pinnedBanks') || "[]");
    }

    // 儲存釘選名單
    function savePins() {
        const checked = Array.from(document.querySelectorAll('.chk-pin:checked')).map(c => c.value);
        localStorage.setItem('pinnedBanks', JSON.stringify(checked));
        document.getElementById('pinSettingsArea').style.display = 'none';
        initAllBankDropdowns(); // 重新整理下拉選單
    }

    function togglePinSettings() {
        const area = document.getElementById('pinSettingsArea');
        area.style.display = area.style.display === 'block' ? 'none' : 'block';
        if(area.style.display === 'block') renderPinCheckboxes();
    }

    function renderPinCheckboxes() {
        const container = document.getElementById('pinCheckboxes');
        const pinned = getPinnedBanks();
        container.innerHTML = "";
        allBanks.sort().forEach(bank => {
            const isChecked = pinned.includes(bank) ? "checked" : "";
            container.innerHTML += `
                <div class="form-check">
                    <input class="form-check-input chk-pin" type="checkbox" value="${bank}" id="pin_${bank}" ${isChecked}>
                    <label class="form-check-label" for="pin_${bank}">${bank}</label>
                </div>`;
        });
    }

    // 重新產生下拉選單 (含釘選邏輯)
    function initAllBankDropdowns() {
        const pinned = getPinnedBanks();
        
        // 境內基金選單
        const onSelect = document.getElementById('bankOn');
        populateSelect(onSelect, allBanks, pinned);

        // 歐義銳榮選單
        const offSelect = document.getElementById('bankOff');
        populateSelect(offSelect, allBanks, pinned);
    }

    function populateSelect(selectEl, fullList, pinnedList) {
        const currentValue = selectEl.value; // 保留當前選擇
        selectEl.innerHTML = '<option value="">-- 選擇銷售機構 --</option>';
        
        const notPinned = fullList.filter(b => !pinnedList.includes(b)).sort();
        const pinnedSorted = fullList.filter(b => pinnedList.includes(b)).sort();

        // 1. 放入釘選的
        if (pinnedSorted.length > 0) {
            pinnedSorted.forEach(b => {
                const opt = new Option("📌 " + b, b);
                selectEl.add(opt);
            });
            // 2. 放入分隔線
            const separator = new Option("--------------------", "");
            separator.disabled = true;
            selectEl.add(separator);
        }

        // 3. 放入其餘的
        notPinned.forEach(b => {
            selectEl.add(new Option(b, b));
        });
        
        selectEl.value = currentValue; // 還原選擇
    }

    // 通用 CSV 讀取功能
    function loadCSV(file, callback) {
        Papa.parse(file, {
            download: true, header: true, skipEmptyLines: true, transformHeader: h => h.trim(),
            complete: res => callback(res)
        });
    }

    window.onload = function() {
        loadCSV("on.csv", res => {
            dataOn = res.data;
            const banks = res.meta.fields.filter(f => !['主要基金','幣別','級別','配息'].includes(f) && f);
            allBanks = [...new Set([...allBanks, ...banks])]; // 合併並去重
            initAllBankDropdowns();
        });
        loadCSV("off1.csv", res => {
            dataOff = res.data;
            const banks = res.meta.fields.filter(f => f && f !== '主要基金');
            allBanks = [...new Set([...allBanks, ...banks])];
            initAllBankDropdowns();
        });
        loadCSV("tax.csv", res => { dataTax = res.data; initTaxList(); });
    };

    // --- 歐義銳榮交集篩選邏輯 ---
    document.getElementById('bankOff').onchange = renderOffList;
    document.querySelectorAll('.off-filter').forEach(el => el.onchange = renderOffList);

    function renderOffList() {
        const bank = document.getElementById('bankOff').value;
        const listDiv = document.getElementById('listOff');
        if (!bank) return;
        const fUSD = document.getElementById('offUSD').checked, fUSDH = document.getElementById('offUSDH').checked,
              fDIV = document.getElementById('offDIV').checked, fEUR = document.getElementById('offEUR').checked,
              fEURH = document.getElementById('offEURH').checked, fAUD = document.getElementById('offAUD').checked;

        let filtered = dataOff.filter(row => {
            const code = String(row[bank] || "").trim().toUpperCase();
            if (code === '' || code === 'X') return false;
            const name = (row['主要基金'] || "").trim();
            const isUSD = /(R2|RM2)$/.test(name), isUSDH = /(RH2|RU2|RMU2)$/.test(name),
                  isEUR = /(R|RM)$/.test(name) && !/(R2|RM2|R4|RM4)$/.test(name),
                  isEURH = /(RH)$/.test(name) && !/(RH2)$/.test(name),
                  isAUD = /(R4|RM4)$/.test(name), isMonthly = /(RM|RM2|RM4|RMU2)$/.test(name);

            let matchCurrency = !(fUSD || fUSDH || fEUR || fEURH || fAUD);
            if (fUSD && isUSD) matchCurrency = true;
            if (fUSDH && isUSDH) matchCurrency = true;
            if (fEUR && isEUR) matchCurrency = true;
            if (fEURH && isEURH) matchCurrency = true;
            if (fAUD && isAUD) matchCurrency = true;
            return matchCurrency && (fDIV ? isMonthly : true);
        });
        const names = [...new Set(filtered.map(r => r['主要基金']))].sort();
        listDiv.innerHTML = `<div class="form-check"><input class="form-check-input" type="checkbox" id="off_all" checked><label class="form-check-label fw-bold">全部顯示 (${names.length})</label></div>`;
        names.forEach((n, idx) => { listDiv.innerHTML += `<div class="form-check"><input class="form-check-input chk-off" type="checkbox" value="${n}" id="off_${idx}"><label class="form-check-label" for="off_${idx}">${n}</label></div>`; });
        const allCheck = document.getElementById('off_all'), itemChecks = document.querySelectorAll('.chk-off');
        allCheck.onclick = () => { if (allCheck.checked) itemChecks.forEach(c => c.checked = false); updateOffTable(filtered); };
        itemChecks.forEach(c => c.onclick = () => { if (c.checked) allCheck.checked = false; updateOffTable(filtered); });
        updateOffTable(filtered);
    }
    function updateOffTable(data) {
        const checked = Array.from(document.querySelectorAll('.chk-off:checked')).map(cb => cb.value), bank = document.getElementById('bankOff').value;
        let final = (document.getElementById('off_all').checked || checked.length === 0) ? data : data.filter(r => checked.includes(r['主要基金']));
        document.getElementById('areaOff').style.display = final.length ? 'block' : 'none';
        const body = document.getElementById('bodyOff'); body.innerHTML = '';
        final.forEach(row => { body.innerHTML += `<tr><td class="fw-bold">${row['主要基金']}</td><td class="text-center code-highlight">${row[bank]}</td></tr>`; });
    }

    // --- 境內基金 ---
    document.getElementById('bankOn').onchange = renderOnList;
    document.querySelectorAll('.on-filter').forEach(el => el.onchange = renderOnList);
    function renderOnList() {
        const bank = document.getElementById('bankOn').value; if (!bank) return;
        let filtered = dataOn.filter(row => {
            const code = String(row[bank] || "").trim().toUpperCase(); if (code === '' || code === 'X') return false;
            if (document.getElementById('onPost').checked && !(row['級別'] || "").includes("後收")) return false;
            if (document.getElementById('onDiv').checked && !(["月配", "季配", "配息"].some(s => (row['配息'] || "").includes(s)))) return false;
            if (document.getElementById('onRMB').checked && !(row['幣別'] || "").includes("人民幣")) return false;
            return true;
        });
        const names = [...new Set(filtered.map(r => r['主要基金']))].sort();
        const listDiv = document.getElementById('listOn');
        listDiv.innerHTML = `<div class="form-check"><input class="form-check-input" type="checkbox" id="on_all" checked><label class="form-check-label fw-bold">全部顯示 (${names.length})</label></div>`;
        names.forEach((n, idx) => { listDiv.innerHTML += `<div class="form-check"><input class="form-check-input chk-on" type="checkbox" value="${n}" id="on_${idx}"><label class="form-check-label" for="on_${idx}">${n}</label></div>`; });
        const allCheck = document.getElementById('on_all'), itemChecks = document.querySelectorAll('.chk-on');
        allCheck.onclick = () => { if (allCheck.checked) itemChecks.forEach(c => c.checked = false); updateOnTable(filtered); };
        itemChecks.forEach(c => c.onclick = () => { if (c.checked) allCheck.checked = false; updateOnTable(filtered); });
        updateOnTable(filtered);
    }
    function updateOnTable(data) {
        const checked = Array.from(document.querySelectorAll('.chk-on:checked')).map(cb => cb.value), bank = document.getElementById('bankOn').value;
        let final = (document.getElementById('on_all').checked || checked.length === 0) ? data : data.filter(r => checked.includes(r['主要基金']));
        document.getElementById('areaOn').style.display = final.length ? 'block' : 'none';
        const body = document.getElementById('bodyOn'); body.innerHTML = '';
        final.forEach(row => { body.innerHTML += `<tr><td><div class="fw-bold">${row['主要基金']}</div><div class="fund-sub-info">${row['幣別']} | ${row['級別']} | ${row['配息']}</div></td><td class="text-center code-highlight">${row[bank]}</td></tr>`; });
    }

    // --- 稅務分析 ---
    function initTaxList() {
        const types = [...new Set(dataTax.map(r => r['投資工具類型']))].filter(t => t);
        const listDiv = document.getElementById('listTax');
        listDiv.innerHTML = `<div class="form-check mb-2"><input class="form-check-input" type="checkbox" id="tax_all" checked><label class="form-check-label fw-bold">全部顯示</label></div>`;
        types.forEach((t, i) => { listDiv.innerHTML += `<div class="form-check"><input class="form-check-input chk-tax" type="checkbox" value="${t}" id="tax_${i}"><label class="form-check-label" for="tax_${i}">${t}</label></div>`; });
        const allCheck = document.getElementById('tax_all'), items = document.querySelectorAll('.chk-tax');
        allCheck.onclick = () => { if (allCheck.checked) items.forEach(c => c.checked = false); updateTaxTable(); };
        items.forEach(c => c.onclick = () => { if (c.checked) allCheck.checked = false; updateTaxTable(); });
        updateTaxTable();
    }
    function updateTaxTable() {
        const checked = Array.from(document.querySelectorAll('.chk-tax:checked')).map(c => c.value);
        let final = (document.getElementById('tax_all').checked || checked.length === 0) ? dataTax : dataTax.filter(r => checked.includes(r['投資工具類型']));
        document.getElementById('areaTax').style.display = final.length ? 'block' : 'none';
        const body = document.getElementById('bodyTax'); body.innerHTML = '';
        final.forEach(row => { body.innerHTML += `<tr><td class="fw-bold text-primary">${row['投資工具類型']}</td><td>${row['自然人']||''}</td><td>${row['法人']||''}</td><td>${row['備註']||''}</td></tr>`; });
    }

    async function takeScreenshot(elId, name, pageSize) {
        const el = document.getElementById(elId);
        const rows = Array.from(el.querySelectorAll('tbody tr'));
        if (rows.length <= pageSize) {
            const canvas = await html2canvas(el, { scale: 2, backgroundColor: "#ffffff" });
            download(canvas.toDataURL(), `${name}.png`);
        } else {
            alert(`共 ${rows.length} 筆，分頁下載中...`);
            for (let i = 0; i < rows.length; i += pageSize) {
                rows.forEach((r, idx) => r.style.display = (idx >= i && idx < i + pageSize) ? '' : 'none');
                const canvas = await html2canvas(el, { scale: 2, backgroundColor: "#ffffff" });
                download(canvas.toDataURL(), `${name}_Part${Math.floor(i/pageSize)+1}頁.png`);
            }
            rows.forEach(r => r.style.display = '');
        }
    }
    function download(uri, n) { const a = document.createElement('a'); a.download = n; a.href = uri; a.click(); }
</script>
</body>
</html>
